afterEvaluate {
  def shadowJarTask = tasks.named('shadowJar').get()
  shadowJarTask.archiveClassifier.set('')

  // shadowJar and jar share the same archive name; do not let the thin jar overwrite the fat one.
  tasks.named('jar', Jar).configure { jarTask ->
    jarTask.dependsOn(shadowJarTask)
    jarTask.actions.clear()
  }

  publishing.publications.configureEach { publication ->
    if (publication instanceof MavenPublication) {
      publication.artifacts.clear()
      publication.artifact(shadowJarTask)
      publication.artifact(tasks.named('sourcesJar').get()) {
        classifier = 'sources'
      }
      publication.artifact(tasks.named('plainJavadocJar').get()) {
        classifier = 'javadoc'
      }
    }
  }

  tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
  }
}
