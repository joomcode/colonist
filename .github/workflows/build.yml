name: Build
on: [ push, pull_request ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build colonist modules
        run: ./gradlew -p colonist check -Pcolonist.shadow.enabled=true

      - name: Publish bootstrap artifacts
        run: ./gradlew -p colonist publishToMavenLocal -Pcolonist.shadow.enabled=true

      - name: Run functional tests
        run: ./gradlew -p colonist functionalTest -Pcolonist.shadow.enabled=true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: functional-test-report
          path: colonist/build/reports/tests/functionalTest

      - name: Run unit tests
        run: ./gradlew check -Pdevelopment=false

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [ 21, 29 ]
        target: [ default ]
        arch: [ x86_64 ]

    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build colonist modules
        run: ./gradlew -p colonist check -Pcolonist.shadow.enabled=true -Pdevelopment=false -Dkotlin.incremental=false

      - name: Publish bootstrap artifacts
        run: ./gradlew -p colonist publishToMavenLocal -Pcolonist.shadow.enabled=true -Pdevelopment=false -Dkotlin.incremental=false

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          script: |
            ./gradlew connectedCheck -Pdevelopment=false
            ./gradlew connectedCheck -Pdevelopment=false -PenabledFeatures=feature2
            ./gradlew connectedCheck -Pdevelopment=false -PenabledFeatures=

  publish:
    name: Publish
    runs-on: ubuntu-latest
    if: contains(github.ref, '/tags/v')
    needs:
      - build
      - test
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Publish to Maven Central
        run: ./gradlew -p colonist publishAndReleaseToMavenCentral -Pcolonist.shadow.enabled=true -Pdevelopment=false
